name: Publish image

on:
  workflow_run:
    workflows: [Kitchen CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: kitchen-publish-${{ github.event_name }}-${{ github.event.release.tag_name || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ghjklw/home-kitchen' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and promotion channel
        id: source
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          channel=main
          if [[ "$EVENT" == release ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git merge-base --is-ancestor "$sha" origin/main
            channel=release
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.10'
          python-version: '3.12'
      # Release tags are independently checked; they cannot bypass CI through a tag.
      - run: uv sync --locked && uv run python -m ruff check . && uv run python -m ruff format --check . && uv run python -m ty check && uv run python -m pytest -q
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ghjklw/home-kitchen:sha-${{ steps.source.outputs.sha }}
            ghcr.io/ghjklw/home-kitchen:build-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/ghjklw/home-kitchen
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
      - name: Record verified image identity for the deployment repository
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          CHANNEL: ${{ steps.source.outputs.channel }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", os.environ["DIGEST"])
          pathlib.Path("image-metadata.json").write_text(json.dumps({
            "source_sha": os.environ["SOURCE_SHA"], "event": os.environ["CHANNEL"],
            "image": "ghcr.io/ghjklw/home-kitchen", "digest": os.environ["DIGEST"],
            "version": os.environ.get("VERSION") or None,
            "tag": "build-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"],
          }))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-metadata
          path: image-metadata.json
          retention-days: 90
