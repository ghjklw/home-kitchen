repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run python -m ruff format --check
        language: system
        types: [python]
      - id: ty
        name: Ty
        entry: uv run python -m ty check
        language: system
        pass_filenames: false
        files: ^(src/|pyproject.toml|uv.lock)
