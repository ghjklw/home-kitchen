name: Kitchen CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitchen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kitchen -d kitchen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KITCHEN_TEST_DATABASE_URL: postgresql+psycopg://kitchen:kitchen@127.0.0.1:5432/kitchen_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.10'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.22.3'
      - run: uv sync --locked
      - run: uv run python -m ruff check .
      - run: uv run python -m ruff format --check .
      - run: uv run python -m ty check
      - run: uv run python -m pytest -q
      - run: node --test tests/*.cjs
      - run: node --check src/home_kitchen/static/app.js && node --check src/home_kitchen/static/sw.js && node --check src/home_kitchen/static/shopping-share.js
