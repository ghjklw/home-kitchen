<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#244c3e" />
    <meta
      name="description"
      content="A shared home for recipes, weekly meals and the shopping list."
    />
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
    <title>Kitchen</title>
    <script defer src="/static/shopping-view.js"></script>
    <script defer src="/static/shopping-share.js"></script>
    <script defer src="/static/recipe-editor.js"></script>
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <a class="brand" href="#week"
            ><img src="/static/icon.svg" alt="" width="42" height="42" /><span
              >Kitchen<small>A little less everyday planning.</small></span
            ></a
          >
          <button class="secondary-nav" data-view="settings" aria-label="Household settings">Settings</button>
        </div>
        <nav aria-label="Main navigation">
          <button data-view="week">Plan</button
          ><button data-view="recipes">Recipes</button
          ><button data-view="shopping">Shopping</button
        </nav>
        <p class="sidebar-note">
          Good meals start with<br />a little room to plan.
        </p>
      </aside>
      <main id="main" tabindex="-1">
        <div class="loading">Opening your kitchen…</div>
      </main>
    </div>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <noscript
      >Kitchen needs JavaScript to load your shared meal plans.</noscript
    >
  </body>
</html>
