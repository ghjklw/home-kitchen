name: Kitchen CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitchen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kitchen -d kitchen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KITCHEN_TEST_DATABASE_URL: postgresql+psycopg://kitchen:kitchen@127.0.0.1:5432/kitchen_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.10'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install dependencies
        run: uv sync --locked
      - name: Static checks & JS tests
        run: uv run pre-commit run --all-files
      - name: Core unit tests (offline, no providers)
        run: uv run pytest -m "not integration and not mocked_provider and not live_acceptance" -q
        env:
          KITCHEN_TEST_DATABASE_URL: ""
      - name: Mocked provider tests (offline synthetic/mocked transports, NOT live acceptance)
        run: uv run pytest -m "mocked_provider and not integration and not live_acceptance" -q
        env:
          KITCHEN_TEST_DATABASE_URL: ""
      - name: Integration tests (disposable PostgreSQL; providers mocked where marked)
        run: uv run pytest -m "integration and not live_acceptance" -q
      - name: Summarize CI test scope vs live acceptance evidence
        if: always()
        shell: bash
        run: |
          {
            echo "### Kitchen CI Test Scope (Offline Only)"
            echo ""
            echo "| Suite | Marker filter | External network / real credentials | Live acceptance evidence? |"
            echo "|---|---|---|---|"
            echo "| JS frontend unit & journey tests | \`node --test tests/*.cjs\` | None | No |"
            echo "| Core unit tests | \`not integration and not mocked_provider and not live_acceptance\` | None | No |"
            echo "| Mocked provider tests | \`mocked_provider and not integration and not live_acceptance\` | None (MockTransport / TestModel / fakes) | **No** |"
            echo "| Integration tests | \`integration and not live_acceptance\` | Disposable PostgreSQL only | **No** |"
            echo "| Live acceptance tests | \`live_acceptance\` | Real provider endpoints/credentials | **Not run in CI** |"
            echo ""
            echo "> Passing \`mocked_provider\` tests confirms offline adapter/contract behavior only and does **not** constitute live acceptance evidence."
          } >> "$GITHUB_STEP_SUMMARY"
