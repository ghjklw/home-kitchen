name: Publish release image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: kitchen-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ghjklw/home-kitchen' && github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a successful main CI run for the released commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git fetch origin main --quiet
          git merge-base --is-ancestor "$sha" origin/main
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed" --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main")] | length')
          test "$runs" -gt 0
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.event.release.tag_name }}
          tags: |
            ghcr.io/ghjklw/home-kitchen:${{ github.event.release.tag_name }}
            ghcr.io/ghjklw/home-kitchen:release-${{ github.event.release.tag_name }}
            ghcr.io/ghjklw/home-kitchen:latest
            ghcr.io/ghjklw/home-kitchen:release-sha-${{ steps.source.outputs.sha }}
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/ghjklw/home-kitchen
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
