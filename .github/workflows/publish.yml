name: Publish image

# Publish the tested main image for UAT; releases promote that same image for production.
on:
  workflow_run:
    workflows: [Kitchen CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kitchen-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ghjklw/home-kitchen' &&
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate main source
        id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$sha" == "$EXPECTED_SHA" ]]
          channel=main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.10'
          python-version: '3.12'
      - name: Resolve app version from Git tags
        id: version
        run: echo "value=$(uvx --from uv-dynamic-versioning uv-dynamic-versioning)" >> "$GITHUB_OUTPUT"
      - name: Record successful upstream CI gate
        shell: bash
        env:
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo "### Publish Verification Gate"
            echo ""
            echo "- **Upstream Kitchen CI**: ${CI_RUN_URL}"
            echo "- **Verified source SHA**: \`${CI_HEAD_SHA}\`"
            echo "- **Checks**: Pre-commit (including JS tests), core unit tests, mocked-provider tests, and PostgreSQL integration tests passed in the upstream CI run."
            echo "- **Publish job**: Reuses that successful result; tests are not rerun."
            echo "- **Live acceptance**: Not covered by CI; verify separately in UAT before promoting to production."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            APP_REVISION=${{ steps.source.outputs.sha }}
          tags: |
            ghcr.io/ghjklw/home-kitchen:sha-${{ steps.source.outputs.sha }}
            ghcr.io/ghjklw/home-kitchen:beta
            ghcr.io/ghjklw/home-kitchen:build-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/ghjklw/home-kitchen
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            io.home-kitchen.run-id=${{ github.run_id }}
            io.home-kitchen.run-attempt=${{ github.run_attempt }}
      - name: Record verified image identity for the deployment repository
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          CHANNEL: ${{ steps.source.outputs.channel }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", os.environ["DIGEST"])
          pathlib.Path("image-metadata.json").write_text(json.dumps({
            "source_sha": os.environ["SOURCE_SHA"], "event": os.environ["CHANNEL"],
            "image": "ghcr.io/ghjklw/home-kitchen", "digest": os.environ["DIGEST"],
            "version": None,
            "tag": "build-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"],
          }))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-metadata
          path: image-metadata.json
          retention-days: 90
      - name: Summarize immutable UAT candidate identity
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
          APP_VERSION: ${{ steps.version.outputs.value }}
          BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          {
            echo "### Published UAT Candidate Image"
            echo ""
            echo "- **Immutable reference**: \`ghcr.io/ghjklw/home-kitchen@${DIGEST}\`"
            echo "- **Source SHA (\`source_sha\`)**: \`${SOURCE_SHA}\`"
            echo "- **Image digest (\`source_digest\`)**: \`${DIGEST}\`"
            echo "- **App version**: \`${APP_VERSION}\`"
            echo "- **Build tag**: \`${BUILD_TAG}\`"
            echo "- **Next step**: Deploy \`@${DIGEST}\` to isolated UAT, verify \`/healthz\`, \`/readyz\`, \`/api/version\`, migrations, backup/restore, and consumer behavior before running \`Promote release image\`."
          } >> "$GITHUB_STEP_SUMMARY"
