name: home-kitchen-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
      POSTGRES_DB: kitchen
    ports:
      - "127.0.0.1:${KITCHEN_POSTGRES_PORT:-55435}:5432"
    volumes:
      - kitchen-local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    mem_limit: 1g
    memswap_limit: 2g
    cpus: 1.0

volumes:
  kitchen-local-postgres:
