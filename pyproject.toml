[project]
name = "home-kitchen"
dynamic = ["version"]
description = "Configurable household recipes, meal planning and shopping via REST and MCP"
requires-python = ">=3.12,<3.14"
dependencies = [
  "azure-identity>=1.25,<2",
  "anthropic>=1.15,<3",
  "cryptography>=46,<51",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "fastmcp>=3.4.11,<4",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "pydantic-ai-slim[anthropic]>=2.68,<3",
  "pyjwt[crypto]>=2.10,<3",
  "recipe-scrapers>=15,<16",
  "uvicorn>=0.34,<1",
  "pillow>=11",
  "py-key-value-aio>=0.4.6,<0.5",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "ty>=0.0.1", "pre-commit>=4,<5"]

[build-system]
requires = ["hatchling>=1.27,<2", "uv-dynamic-versioning>=0.11,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.1.0"
style = "pep440"

[tool.hatch.build.targets.wheel]
packages = ["src/home_kitchen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: DB-backed or disposable infrastructure integration tests",
  "mocked_provider: offline tests using mocked, stubbed, or synthetic provider/AI transports (not live acceptance evidence)",
  "live_acceptance: live provider acceptance tests against real external endpoints or credentials (excluded from offline CI)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["src"]
